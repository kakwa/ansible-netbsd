---
# waker: Wake-on-LAN helper for a target host.
#
# Runs a small HTTP service bound to localhost. nginx calls it from an
# auth_request subrequest before proxying to the target host: if the host is
# already up the subrequest returns immediately, otherwise a magic packet
# is sent and the subrequest waits until the host answers again.
waker_enable: true

# Target host. It can resolve through the mDNS/unbound setup; the IP is used
# for the reachability check so the service works even if DNS is not.
waker_target_host: "target.local"
waker_target_ip: "192.168.1.20"

# MAC address of the NIC to wake. REQUIRED when waker_enable is true.
# Example: "aa:bb:cc:dd:ee:ff".
waker_target_mac: "A0:36:9F:5B:38:02"

# TCP port used to decide whether the target is already up.
waker_check_port: 443

# Magic packet destination (UDP).
waker_broadcast: "255.255.255.255"
waker_wol_port: 9

# How long to wait for the target to come back, and how often to poll.
waker_wake_timeout: 90
waker_wake_poll_interval: 2

# Resend the magic packet this often while waiting. A packet that arrives
# while the target is still entering suspend is consumed as a pending wakeup
# (the kernel aborts the freeze and re-enters suspend), so one early packet
# is not enough. Set to 0 to send only once.
waker_wol_retry_interval: 5

# Local HTTP endpoint consumed by nginx (auth_request).
waker_listen_addr: "127.0.0.1"
waker_listen_port: 8099

# Runtime files.
waker_pid_file: "/var/run/waker.pid"
waker_user: "root"
waker_group: "wheel"

# Python interpreter and package (pkgsrc python312).
waker_python: "/usr/pkg/bin/python3.12"
waker_packages:
  - python312
