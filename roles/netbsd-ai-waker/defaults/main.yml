---
# ai-waker: Wake-on-LAN helper for the AI host (ai.local).
#
# Runs a small HTTP service bound to localhost. nginx calls it from an
# auth_request subrequest before proxying to the AI host: if the host is
# already up the subrequest returns immediately, otherwise a magic packet
# is sent and the subrequest waits until the host answers again.
ai_waker_enable: true

# Target host. ai.local resolves through the mDNS/unbound setup; the IP is
# used for the reachability check so the service works even if DNS is not.
ai_waker_target_host: "ai.local"
ai_waker_target_ip: "192.168.1.20"

# MAC address of the NIC to wake. REQUIRED when ai_waker_enable is true.
# Example: "aa:bb:cc:dd:ee:ff".
ai_waker_target_mac: ""

# TCP port used to decide whether the target is already up.
ai_waker_check_port: 443

# Magic packet destination (UDP).
ai_waker_broadcast: "255.255.255.255"
ai_waker_wol_port: 9

# How long to wait for the target to come back, and how often to poll.
ai_waker_wake_timeout: 90
ai_waker_wake_poll_interval: 2

# Local HTTP endpoint consumed by nginx (auth_request).
ai_waker_listen_addr: "127.0.0.1"
ai_waker_listen_port: 8099

# Runtime files.
ai_waker_pid_file: "/var/run/ai-waker.pid"
ai_waker_user: "root"
ai_waker_group: "wheel"

# Python interpreter and package (pkgsrc python312).
ai_waker_python: "/usr/pkg/bin/python3.12"
ai_waker_packages:
  - python312
